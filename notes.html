<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LectureLens — AI Lecture Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0e0c;
    --paper: #f5f0e8;
    --cream: #ede7d5;
    --accent: #c84b2f;
    --accent-dim: #e8a090;
    --gold: #c9a84c;
    --muted: #7a7060;
    --border: #d4c9b0;
    --radius: 4px;
  }

  html { font-size: 16px; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Noise texture overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: .5;
  }

  /* ── Header ── */
  header {
    border-bottom: 2px solid var(--ink);
    padding: 1.25rem 2.5rem;
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .logo span { color: var(--accent); }
  .tagline {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-left: 1px solid var(--border);
    padding-left: 1.25rem;
    line-height: 1.4;
  }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: calc(100vh - 66px);
  }

  /* ── Left panel (upload) ── */
  .panel-upload {
    border-right: 2px solid var(--ink);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    background: var(--cream);
  }
  .panel-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .5rem;
  }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(200,75,47,.04);
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    font-size: 2.5rem;
    margin-bottom: .75rem;
    display: block;
    line-height: 1;
  }
  .drop-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: .4rem;
  }
  .drop-sub { font-size: 0.72rem; color: var(--muted); line-height: 1.5; }

  /* File preview */
  #file-preview {
    display: none;
    align-items: center;
    gap: .75rem;
    padding: .85rem 1rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: .78rem;
  }
  #file-preview .file-icon { font-size: 1.4rem; flex-shrink: 0; }
  #file-preview .file-name { font-weight: 500; word-break: break-all; }
  #file-preview .file-size { color: var(--muted); margin-top: 2px; }
  .file-remove {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1rem; line-height: 1; flex-shrink: 0;
    transition: color .15s;
  }
  .file-remove:hover { color: var(--accent); }

  /* Submit btn */
  .btn-process {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .9rem 1.5rem;
    background: var(--ink);
    color: var(--paper);
    border: none; border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .18s, transform .12s;
  }
  .btn-process:hover:not(:disabled) { background: var(--accent); transform: translateY(-1px); }
  .btn-process:disabled { opacity: .45; cursor: not-allowed; }

  /* Status log */
  .status-log {
    font-size: .72rem;
    line-height: 1.9;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
  }
  .status-log .entry { display: flex; gap: .5rem; }
  .status-log .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border); flex-shrink: 0; margin-top: .45rem;
  }
  .status-log .dot.active { background: var(--gold); animation: pulse 1s infinite; }
  .status-log .dot.done { background: #5c9e6e; }
  .status-log .dot.error { background: var(--accent); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

  /* ── Right panel (results) ── */
  .panel-results {
    padding: 2.5rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    overflow-y: auto;
  }

  /* Placeholder */
  .placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 1rem; color: var(--muted);
    opacity: 0; animation: fadein .6s .2s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .placeholder-glyph {
    font-size: 5rem; line-height: 1;
    font-family: 'Playfair Display', serif;
    color: var(--border); font-style: italic;
  }
  .placeholder p { font-size: .78rem; letter-spacing: .06em; }

  /* Result cards */
  .result-block { display: none; flex-direction: column; gap: 1.75rem; }
  .result-block.visible { display: flex; animation: slidein .4s ease; }
  @keyframes slidein { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  .result-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .result-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: .75rem 1.25rem;
    background: var(--cream);
    border-bottom: 1.5px solid var(--border);
  }
  .result-card-title {
    font-size: .65rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: .5rem;
  }
  .result-card-title span { font-size: .85rem; }
  .btn-copy {
    font-family: 'DM Mono', monospace;
    font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .3rem .7rem;
    border: 1px solid var(--border);
    background: white; border-radius: var(--radius);
    cursor: pointer; color: var(--muted);
    transition: border-color .15s, color .15s;
  }
  .btn-copy:hover { border-color: var(--ink); color: var(--ink); }
  .btn-copy.copied { border-color: #5c9e6e; color: #5c9e6e; }

  .result-card-body {
    padding: 1.5rem 1.25rem;
    font-size: .82rem;
    line-height: 1.9;
    white-space: pre-wrap;
    background: white;
    max-height: 400px;
    overflow-y: auto;
  }
  /* Notes rendering */
  .notes-body { font-size: .82rem; line-height: 1.9; background: white; padding: 1.25rem; max-height: 520px; overflow-y: auto; }
  .notes-body h1, .notes-body h2, .notes-body h3 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    margin: 1.1em 0 .4em; color: var(--ink);
  }
  .notes-body h1 { font-size: 1.15rem; }
  .notes-body h2 { font-size: 1rem; }
  .notes-body h3 { font-size: .9rem; color: var(--muted); }
  .notes-body ul, .notes-body ol { padding-left: 1.4em; }
  .notes-body li { margin-bottom: .3em; }
  .notes-body strong { font-weight: 500; }
  .notes-body p { margin-bottom: .6em; }
  .notes-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  .meta-strip {
    font-size: .68rem; color: var(--muted);
    display: flex; gap: 1.5rem;
    padding: .6rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--cream);
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Spinner */
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .panel-upload { border-right: none; border-bottom: 2px solid var(--ink); }
  }
</style>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
</head>
<body>

<header>
  <div class="logo">Lecture<span>Lens</span></div>
  <div class="tagline">Lecture audio →<br>transcript + study notes</div>
</header>

<main>
  <!-- ── Upload panel ── -->
  <aside class="panel-upload">
    <div>
      <div class="panel-label">— Upload Audio</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*" />
        <span class="drop-icon">🎙</span>
        <div class="drop-title">Drop your lecture here</div>
        <div class="drop-sub">MP3, M4A, WAV, OGG, WEBM<br>Click to browse</div>
      </div>
    </div>

    <div id="file-preview">
      <span class="file-icon">🔊</span>
      <div>
        <div class="file-name" id="fileName">—</div>
        <div class="file-size" id="fileSize">—</div>
      </div>
      <button class="file-remove" id="removeFile" title="Remove">✕</button>
    </div>


    <button class="btn-process" id="processBtn" disabled>
      <span id="btnText">Process Audio</span>
      <span id="btnSpinner" style="display:none" class="spinner"></span>
    </button>

    <div class="status-log" id="statusLog" style="display:none">
      <div class="panel-label" style="margin-bottom:.75rem">Status</div>
    </div>
  </aside>

  <!-- ── Results panel ── -->
  <section class="panel-results">
    <div class="placeholder" id="placeholder">
      <div class="placeholder-glyph">§</div>
      <p>Upload an audio file and press<br><strong>Process Audio</strong> to begin.</p>
    </div>

    <div class="result-block" id="resultBlock">
      <!-- Notes card -->
      <div class="result-card">
        <div class="result-card-head">
          <div class="result-card-title"><span>📋</span> AI Notes</div>
          <div style="display:flex;gap:.4rem"><button class="btn-copy" id="downloadNotes">Download .md</button><button class="btn-copy" id="copyNotes">Copy</button></div>
        </div>
        <div class="notes-body" id="notesBody"></div>
        <div class="meta-strip" id="notesMeta"></div>
      </div>

      <!-- Transcript card -->
      <div class="result-card">
        <div class="result-card-head">
          <div class="result-card-title"><span>📝</span> Full Transcript</div>
          <button class="btn-copy" id="copyTranscript">Copy</button>
        </div>
        <div class="result-card-body" id="transcriptBody"></div>
        <div class="meta-strip" id="transcriptMeta"></div>
      </div>
    </div>
  </section>
</main>

<script>
  const fileInput    = document.getElementById('fileInput');
  const dropZone     = document.getElementById('dropZone');
  const filePreview  = document.getElementById('file-preview');
  const fileName     = document.getElementById('fileName');
  const fileSize     = document.getElementById('fileSize');
  const removeFile   = document.getElementById('removeFile');
  const processBtn   = document.getElementById('processBtn');
  const btnText      = document.getElementById('btnText');
  const btnSpinner   = document.getElementById('btnSpinner');
  const statusLog    = document.getElementById('statusLog');
  const placeholder  = document.getElementById('placeholder');
  const resultBlock  = document.getElementById('resultBlock');
  const notesBody    = document.getElementById('notesBody');
  const transcriptBody = document.getElementById('transcriptBody');
  const notesMeta    = document.getElementById('notesMeta');
  const transcriptMeta = document.getElementById('transcriptMeta');

  let selectedFile = null;
  let lastFileName = 'lecture';
  let lastNotes = '';

  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    return (b/(1024*1024)).toFixed(1) + ' MB';
  }

  function wordCount(str) {
    return str.trim().split(/\s+/).filter(Boolean).length;
  }

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatBytes(file.size);
    filePreview.style.display = 'flex';
    processBtn.disabled = false;
  }

  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
  removeFile.addEventListener('click', () => {
    selectedFile = null; fileInput.value = '';
    filePreview.style.display = 'none';
    processBtn.disabled = true;
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('audio/')) setFile(f);
  });

  function addStatus(text, state = 'active') {
    statusLog.style.display = 'block';
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `<div class="dot ${state}"></div><div></div>`;
    el.lastChild.textContent = text;
    statusLog.appendChild(el);
    return el.querySelector('.dot');
  }

  // Render the AI's Markdown safely: marked parses it, DOMPurify strips any injected scripts/HTML
  function markdownToHtml(md) {
    return DOMPurify.sanitize(marked.parse(md || ''));
  }

  processBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    // reset UI
    statusLog.innerHTML = '<div class="panel-label" style="margin-bottom:.75rem">Status</div>';
    resultBlock.classList.remove('visible');
    placeholder.style.display = 'flex';
    processBtn.disabled = true;
    btnText.textContent = 'Processing…';
    btnSpinner.style.display = 'inline-block';

    const dot1 = addStatus('Uploading & processing with Gemini (longer lectures take a minute)…');
    lastFileName = selectedFile.name.replace(/\.[^.]+$/, '');
    const start = Date.now();

    try {
      const formData = new FormData();
      formData.append('audio', selectedFile);

      // One request: server uploads audio to Gemini, which transcribes and summarizes it
      const res = await fetch('/process-audio', { method: 'POST', body: formData });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { dot1.className = 'dot error'; throw new Error(data.error || `Server error ${res.status}`); }
      dot1.className = 'dot done';

      const elapsed = ((Date.now() - start)/1000).toFixed(1);
      addStatus(`Done in ${elapsed}s`, 'done');

      // Render results
      placeholder.style.display = 'none';
      transcriptBody.textContent = data.transcript;
      lastNotes = data.notes;
      notesBody.innerHTML = markdownToHtml(data.notes);

      const twc = wordCount(data.transcript);
      const nwc = wordCount(data.notes);
      transcriptMeta.textContent = `${twc} words`;
      notesMeta.textContent = `${nwc} words · summarized from ${twc} word transcript`;

      resultBlock.classList.add('visible');

    } catch (err) {
      addStatus('Error: ' + err.message, 'error');
    } finally {
      processBtn.disabled = false;
      btnText.textContent = 'Process Audio';
      btnSpinner.style.display = 'none';
    }
  });

  // Copy buttons
  function setupCopy(btn, getContent) {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(getContent()).then(() => {
        btn.textContent = 'Copied!'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    });
  }
  setupCopy(document.getElementById('copyNotes'), () => notesBody.innerText);
  setupCopy(document.getElementById('copyTranscript'), () => transcriptBody.textContent);

  document.getElementById('downloadNotes').addEventListener('click', () => {
    const blob = new Blob([lastNotes], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${lastFileName}-notes.md`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
